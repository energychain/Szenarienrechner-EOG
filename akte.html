<body>
<a class="akte-skip-link" href="#akteObjectSurface">Zum Objekt springen</a>
<header class="akte-header">
  <div class="akte-header-identity">
    <span id="akteSectorLabel" class="akte-sector-pill">Gas</span>
    <span id="akteModelName" class="akte-model-name">Digitale Akte</span>
    <label class="akte-phase-label" for="aktePhaseSelect">Phase</label>
    <select id="aktePhaseSelect" aria-label="Prozessphase"></select>
  </div>
  <div class="akte-header-search">
    <input id="akteSearch" type="search" placeholder="Suchen (Strg+K)" aria-label="Objekte durchsuchen">
  </div>
  <div class="akte-header-actions">
    <button type="button" id="akteLoadDemoButton">Demodaten laden</button>
    <button type="button" id="akteImportButton">Modell laden</button>
    <input id="akteImportFile" type="file" accept="application/json" hidden>
    <button type="button" id="akteSaveButton">Speichern</button>
    <button type="button" id="akteExportButton">Exportieren</button>
    <button type="button" id="akteExportHtmlButton">HTML mit Daten speichern</button>
    <button type="button" id="akteOutputButton">Ausgaben</button>
  </div>
</header>

<section id="akteKpiStrip" class="akte-kpi-strip" aria-label="Ergebnisstreifen"></section>

<main class="akte-columns">
  <nav id="akteFilterColumn" class="akte-filter-column" aria-label="Filter"></nav>
  <section id="akteObjectSurface" class="akte-object-surface" aria-label="Objekt" tabindex="-1"></section>
  <aside id="akteContextColumn" class="akte-context-column" aria-label="Kontext"></aside>
</main>

<div id="akteToast" class="akte-toast hidden" role="status" aria-live="polite"></div>
<div id="akteValuePopover" class="akte-value-popover hidden" role="dialog" aria-label="Wert bearbeiten"></div>

<div id="akteOutputOverlay" class="akte-output-overlay hidden" role="dialog" aria-label="Ausgaben">
  <div class="akte-output-panel">
    <div class="akte-output-header">
      <h2>Ausgaben</h2>
      <button type="button" id="akteOutputClose">Schließen</button>
    </div>
    <nav id="akteOutputTabs" class="akte-output-tabs"></nav>
    <div id="akteOutputBody" class="akte-output-body"></div>
  </div>
</div>

</body>
</html>
